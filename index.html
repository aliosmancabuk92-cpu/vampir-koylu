  .fb .fbody{background:var(--card);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;max-width:82%;font-size:14px;line-height:1.4}

  .fb.me{flex-direction:row-reverse} .fb.me .fbody{background:#2a2335;border-color:var(--blue);border-radius:14px 14px 4px 14px}

  @keyframes pop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.4)}100%{transform:scale(1);opacity:1}}
  input[type=range]{padding:0;margin:6px 0 14px;accent-color:var(--gold);background:transparent;border:0}
</style>

<script type="module">
import { createClient } from './supabase.js';
import { mountSolo } from './solo.js';

/* ================== AYARLAR ================== */
const SUPABASE_URL = 'https://jqbokjkswdkhvdeegfbh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Vpnzl1uasuRis03GAQJIpg_PldkwGIP';
const MIN_PLAYERS = 4;
const DEFAULTS = { discussionSec: 120, voteSec: 60 };

const ROLES = {
  vampir: { name:'Vampir', ic:'🧛', desc:'Her gece diğer vampirlerle birlikte bir köylüyü seçip öldürürsünüz. Gündüz kimliğinizi gizleyin. Köylü sayısı vampir sayısına eşitlenince kazanırsınız.' },
  doktor: { name:'Doktor', ic:'🩺', desc:'Her gece bir kişiyi korursun. Vampirler o kişiyi seçerse hayatta kalır. Kendini de koruyabilirsin.' },
  kahin:  { name:'Kâhin',  ic:'🔮', desc:'Her gece bir kişiyi seçersin ve onun vampir olup olmadığını öğrenirsin. Bilgini akıllıca kullan.' },
  koylu:  { name:'Köylü',  ic:'🧑‍🌾', desc:'Özel bir yeteneğin yok ama oyun sende biter. Tartış, şüphelen, doğru kişiyi as. Tüm vampirler asılınca kazanırsınız.' },
};

/* ================== YARDIMCILAR ================== */
const $ = (s)=>document.querySelector(s);
const app = $('#app');
const uid = ()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc = (s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = (a)=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const genCode = ()=>{const L='ABCDEFGHJKLMNPRSTUVYZ';let c='';for(let i=0;i<4;i++)c+=L[Math.floor(Math.random()*L.length)];return c;};
let toastT; function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}

/* ================== SES (ANLATICI) ================== */
const voice = {
  on: localStorage.getItem('vk_voice') === '1',
  set(v){ this.on=v; localStorage.setItem('vk_voice', v?'1':'0'); },
  speak(text){
    if(!this.on || !('speechSynthesis' in window)) return;
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang='tr-TR'; u.rate=0.92; u.pitch=0.85;
      const v = speechSynthesis.getVoices().find(v=>v.lang && v.lang.toLowerCase().startsWith('tr'));
      if(v) u.voice=v;
      speechSynthesis.speak(u);
    }catch(e){}
  }
};
if('speechSynthesis' in window) speechSynthesis.getVoices();

/* Ekranı açık tut */
let wakeLock=null;
async function keepAwake(){ try{ if('wakeLock' in navigator && !wakeLock){ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>wakeLock=null);} }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') keepAwake(); });

/* ================== BAĞLANTI ================== */
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
let channel=null;
let me = { id: localStorage.getItem('vk_pid') || (()=>{const i=uid();localStorage.setItem('vk_pid',i);return i;})(), name: localStorage.getItem('vk_name')||'' };
let isHost=false;
let S=null;            // oyun durumu (herkes için)
let screen='mode';     // mode | solo | home | join | game
let joinTimeout=null;
let localSel=null;     // seçim (hedef)
let timerTick=null;
let lastPhaseSpoken='';

function connect(code, onReady){
  if(channel){ supabase.removeChannel(channel); channel=null; }
  channel = supabase.channel('vk-'+code, { config:{ broadcast:{ self:false, ack:false } } });
  channel
    .on('broadcast', {event:'action'}, ({payload})=>{ if(isHost) hostHandle(payload); })
    .on('broadcast', {event:'state'},  ({payload})=>{ if(!isHost) applyState(payload); })
    .on('broadcast', {event:'ping'},   ({payload})=>{ if(isHost && payload.code===S?.code) hostHandle({type:'hello', from:payload.from}); })
    .subscribe((status)=>{ if(status==='SUBSCRIBED'){ onReady&&onReady(); } else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){ toast('Bağlantı sorunu, tekrar deneniyor…'); } });
}
function send(action){
  action.from = me.id;
  if(isHost){ hostHandle(action); }
  else if(channel){ channel.send({type:'broadcast', event:'action', payload:action}); }
}
let bcastT=null;
function broadcast(){
  if(!isHost||!channel) return;
  S.ts=Date.now();
  channel.send({type:'broadcast', event:'state', payload:S});
  render();
}

/* ================== OYUN MANTIĞI (HOST) ================== */
function newState(code){
  return { code, hostId: me.id, phase:'lobby', day:0, players:[], settings:{...DEFAULTS},
    roleAck:{}, night:{vampVotes:{}, doctor:null, seer:null, seerResult:null}, lastNight:null,
    votes:{}, lastVote:null, winner:null, timerEnd:null, log:[] };
}
const alive = (s)=>s.players.filter(p=>p.alive);
const P = (s,id)=>s.players.find(p=>p.id===id);
function roleCounts(n){ const v = n>=12?3 : n>=8?2 : 1; return { vampir:v, doktor:1, kahin:1, koylu:n-v-2 }; }

function hostHandle(a){
  if(!S) return;
  const p = P(S,a.from);
  switch(a.type){
    case 'hello': case 'join': {
      if(p){ p.connected=true; if(a.name) p.name=a.name; }
      else if(S.phase==='lobby'){ S.players.push({id:a.from, name:a.name||'Oyuncu', alive:true, role:null, connected:true}); log(`${a.name} katıldı.`); }
      else { /* oyun ortasında yeni oyuncu: izleyici olarak eklenmez, sadece state gönder */ }
      break;
    }
    case 'leave': { if(S.phase==='lobby') S.players=S.players.filter(x=>x.id!==a.from); else if(p) p.connected=false; break; }
    case 'kick': { if(a.from===S.hostId && S.phase==='lobby') S.players=S.players.filter(x=>x.id!==a.target); break; }
    case 'settings': { if(a.from===S.hostId && S.phase==='lobby') S.settings={...S.settings,...a.settings}; break; }
    case 'start': { if(a.from===S.hostId && S.phase==='lobby') startGame(); break; }
    case 'ackRole': { if(S.phase==='roles'){ S.roleAck[a.from]=true; if(S.players.every(x=>S.roleAck[x.id])) toNight(); } break; }
    case 'night': { if(S.phase==='night' && p && p.alive) nightAction(p,a.target); break; }
    case 'vote': { if(S.phase==='vote' && p && p.alive){ S.votes[p.id]=a.target; if(alive(S).every(x=>S.votes[x.id]!==undefined)) resolveVote(); } break; }
    case 'next': { if(a.from===S.hostId) hostNext(); break; }
    case 'restart': { if(a.from===S.hostId) restart(); break; }
  }
  broadcast();
}
function log(t){ S.log.unshift(t); S.log=S.log.slice(0,40); }

function startGame(){
  const n=S.players.length; if(n<MIN_PLAYERS) return;
  const rc=roleCounts(n); const pool=[];
  for(const [r,c] of Object.entries(rc)) for(let i=0;i<c;i++) pool.push(r);
  const sh=shuffle(pool);
  S.players.forEach((p,i)=>{ p.role=sh[i]; p.alive=true; });
  S.phase='roles'; S.day=0; S.roleAck={}; S.winner=null; S.lastNight=null; S.lastVote=null; S.log=[];
  log(`Oyun başladı: ${rc.vampir} vampir, 1 doktor, 1 kâhin, ${rc.koylu} köylü.`);
}
function toNight(){
  S.phase='night'; S.day++; S.night={vampVotes:{}, doctor:null, seer:null, seerResult:null}; S.timerEnd=null;
  // doktor/kâhin ölüyse otomatik tamam
  checkNightDone();
}
function nightAction(p,target){
  if(p.role==='vampir'){ S.night.vampVotes[p.id]=target; }
  else if(p.role==='doktor'){ S.night.doctor=target; }
  else if(p.role==='kahin'){ S.night.seer=target; const t=P(S,target); S.night.seerResult = t ? (t.role==='vampir') : null; }
  checkNightDone();
}
function checkNightDone(){
  const al=alive(S);
  const vamps=al.filter(x=>x.role==='vampir');
  const doc=al.find(x=>x.role==='doktor'); const seer=al.find(x=>x.role==='kahin');
  const vampsDone = vamps.every(v=>S.night.vampVotes[v.id]);
  const docDone = !doc || S.night.doctor; const seerDone = !seer || S.night.seer;
  if(vampsDone && docDone && seerDone) resolveNight();
}
function resolveNight(){
  const tally={}; Object.values(S.night.vampVotes).forEach(t=>{ if(t&&t!=='__none') tally[t]=(tally[t]||0)+1; });
  let victim=null, max=0; for(const [t,c] of Object.entries(tally)){ if(c>max){max=c;victim=t;} }
  const saved = victim && S.night.doctor===victim;
  let killed=null;
  if(victim && !saved){ const v=P(S,victim); if(v){ v.alive=false; killed=victim; } }
  S.lastNight={killed, saved:!!saved, victimName: victim?P(S,victim)?.name:null,
    seer: (S.night.seer && S.night.seer!=='__none') ? {target:S.night.seer, isVamp:S.night.seerResult} : null};
  log(killed ? `Gece ${S.day}: ${P(S,killed).name} öldürüldü.` : `Gece ${S.day}: kimse ölmedi.`);
  S.phase='dawn'; S.votes={};
  if(!checkWin()) {}
}
function startDiscussion(){ S.phase='discussion'; S.timerEnd=Date.now()+S.settings.discussionSec*1000; armTimer(()=>{ if(S.phase==='discussion'){ startVote(); broadcast(); } }); }
function startVote(){ S.phase='vote'; S.votes={}; S.timerEnd=Date.now()+S.settings.voteSec*1000; armTimer(()=>{ if(S.phase==='vote'){ resolveVote(); broadcast(); } }); }
function resolveVote(){
  clearTimeout(hostTimer); S.timerEnd=null;
  const tally={}; let skip=0;
  for(const [v,t] of Object.entries(S.votes)){ if(t==='skip'||!t) skip++; else tally[t]=(tally[t]||0)+1; }
  let hanged=null, max=0, tie=false;
  for(const [t,c] of Object.entries(tally)){ if(c>max){max=c;hanged=t;tie=false;} else if(c===max) tie=true; }
  if(tie || max===0 || skip>=max) hanged=null;
  const hp = hanged?P(S,hanged):null;
  if(hp){ hp.alive=false; log(`Gün ${S.day}: ${hp.name} asıldı (${ROLES[hp.role].name}).`); } else log(`Gün ${S.day}: kimse asılmadı.`);
  S.lastVote={hanged, tally, skip, tie, role: hp?hp.role:null, name: hp?hp.name:null};
  S.phase='verdict';
  checkWin();
}
function checkWin(){
  const al=alive(S); const v=al.filter(x=>x.role==='vampir').length; const o=al.length-v;
  if(v===0){ S.winner='koylu'; S.phase='end'; return true; }
  if(v>=o){ S.winner='vampir'; S.phase='end'; return true; }
  return false;
}
function hostNext(){
  clearTimeout(hostTimer);
  switch(S.phase){
    case 'roles': toNight(); break;
    case 'night': // zorla: eksik aksiyonları boş geç
      { const al=alive(S); al.filter(x=>x.role==='vampir'&&!S.night.vampVotes[x.id]).forEach(x=>S.night.vampVotes[x.id]='__none'); S.night.doctor=S.night.doctor||'__none'; S.night.seer=S.night.seer||'__none'; resolveNight(); } break;
    case 'dawn': startDiscussion(); break;
    case 'discussion': startVote(); break;
    case 'vote': resolveVote(); break;
    case 'verdict': toNight(); break;
  }
}

function narrate(mine){
  const key=S.code+':'+S.phase+':'+S.day+':'+(S.phase==='end'?S.winner:'');
  if(key===lastPhaseSpoken) return; lastPhaseSpoken=key;
  localSel=null;

  switch(S.phase){
    case 'roles': t='Roller dağıtıldı. Herkes telefonundaki rolüne gizlice baksın ve kimseye göstermesin.'; break;
    case 'night': t= S.day===1 ? 'Gece oluyor. Köy uykuya dalıyor. Vampirler, uyanın ve kurbanınızı seçin. Doktor, koruyacağın kişiyi seç. Kâhin, araştıracağın kişiyi seç.' : `Gece ${S.day}. Köy yeniden uykuya dalıyor. Vampirler, doktor ve kâhin, telefonlarınızdan seçiminizi yapın.`; break;
    case 'dawn': { const ln=S.lastNight||{}; const k=ln.killed?P(S,ln.killed):null; t= k ? `Sabah oldu. Köylüler uyanıyor. Ne yazık ki ${k.name} bu gece öldürüldü. ${k.name}, ${ROLES[k.role].name} idi.` : (ln.saved?'Sabah oldu. Vampirler saldırdı ama doktor zamanında yetişti. Bu gece kimse ölmedi.':'Sabah oldu. Bu gece kimse ölmedi.'); break; }
    case 'discussion': t=`Tartışma başlıyor. ${S.settings.discussionSec} saniyeniz var. Kim vampir? Konuşun.`; break;
    case 'vote': t='Oylama zamanı. Herkes telefonundan asılmasını istediği kişiyi seçsin.'; break;
    case 'verdict': { const lv=S.lastVote||{}; t= lv.hanged ? `Köy kararını verdi. ${lv.name} asıldı. ${lv.name}, ${ROLES[lv.role].name} idi.` : (lv.tie?'Oylar eşit çıktı. Bugün kimse asılmadı.':'Köy kimseyi asmamaya karar verdi.'); break; }
    case 'end': t= S.winner==='vampir' ? 'Oyun bitti. Vampirler köyü ele geçirdi. Vampirler kazandı!' : 'Oyun bitti. Son vampir de yok edildi. Köylüler kazandı!'; break;
  }
  if(t) voice.speak(t);
}

/* ================== SAYAÇ ================== */
function runTimer(){
  clearInterval(timerTick);
  const el=$('#timer'); if(!el||!S.timerEnd) return;
  const upd=()=>{ const s=Math.max(0,Math.ceil((S.timerEnd-Date.now())/1000)); el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; el.classList.toggle('warn',s<=10); if(s<=0) clearInterval(timerTick); };
  upd(); timerTick=setInterval(upd,500);
}

/* ================== PWA ================== */
if('serviceWorker' in navigator && /^https?:/.test(location.protocol) && !/localhost|127\.0\.0\.1/.test(location.hostname)){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
/* iOS Safari: sesler geç yüklenir */
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();

/* ================== BAŞLAT ================== */
window.addEventListener('beforeunload',()=>{ if(channel&&!isHost) send({type:'leave'}); });
render();
</script>
